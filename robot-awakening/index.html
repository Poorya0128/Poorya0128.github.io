<script>

// ---------- camera ----------

// ---- paint.js ----
// ---------- painting primitives (gouache background + ink for cels) ----------
function blobPath(ctx, x, y, rx, ry, rot, jag = .25, n = 9, ph) {
  const pts = [];

  ctx.moveTo(m0[0], m0[1]);

    const p = pts[i % n], q = pts[(i + 1) % n];
    const P = T(p), M = T([(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]);

function blob(ctx, x, y, rx, ry, rot, col, jag, n) { ctx.fillStyle = col; ctx.beginPath(); blobPath(ctx, x, y, rx, ry, rot, jag, n); ctx.fill(); }

// smooth closed path through points
function smoothClosed(ctx, pts) {

// ---------- tree trunk ----------
function paintTrunk(ctx, pts, ws, pal, o = {}) {
  // pts: screen centerline base->top; ws: half-widths

    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const w = ws[i]; Ls.push([pts[i][0] + dy * w, pts[i][1] - dx * w]); Rs.push([pts[i][0] - dy * w, pts[i][1] + dx * w]);

  poly(Ls, Rs, rgb(pal.base));
  const W0 = ws[0];

async function prepare(progress) {

  FW = [Math.sin(ROBOT.yaw), 0, Math.cos(ROBOT.yaw)]; LEFTV = [Math.cos(ROBOT.yaw), 0, -Math.sin(ROBOT.yaw)]; RIGHTV = vmul(LEFTV, -1);
  // framing trees for the wide shot
  WORLD.trees = WORLD.trees.filter(t => Math.hypot(t.x + 5.5, t.z - 24.5) > 8 && Math.hypot(t.x - 18, t.z - 21) > 7);
  const frame = (x, z, h, r, seed) => { srand(seed); const tr = { x, z, h, r, lean: [.02, 0], seed, clumps: [], branches: [] }; for (let k = 0; k < 12; k++) { const t = rnd(); const y = lerp(h * .5, h, t); const a = rnd(TAU); const sp = (1 - t * .6) * rnd(2, 7) + 1; const p = [x + Math.cos(a) * sp, y, z + Math.sin(a) * sp]; tr.clumps.push({ p, r: rnd(3, 5.5), a, t }); tr.branches.push({ from: [x, y - 2, z], to: p }); } WORLD.trees.push(tr); };

  }
  makeKeys(); initVines(); CAMS = defineShots();
  for (const k in CAMS) { const e = CAMS[k].eye; WORLD.trees = WORLD.trees.filter(t => t.seed === 4401 || t.seed === 4402 || Math.hypot(t.x - e[0], t.z - e[2]) > 9); WORLD.bushes = WORLD.bushes.filter(b => Math.hypot(b.x - e[0], b.z - e[2]) > 4); } initDebris(); initFlock(CAMS.wide.cam);
  const J0 = rig(POSE.kneel);
  const jobs = [
    ['wide', { split: 0, mist: [26, 40, 60, 90, 140, 210] }],
    ['rise', { split: 0, minDepth: 4 }],
    ['shoulder', { split: -1, minDepth: 9, groundN: 16000, blur: 2.2 }],
    ['face', { split: -1, minDepth: 9, groundN: 14000, blur: 2.6 }],
    ['chest', { split: -1, minDepth: 9, groundN: 14000, blur: 2.4 }],

    if (k === 'sky') o.split = 24;

// ---------- sun mask ----------
function drawMask(s, t, F) {

  const kind = s.sun; if (!kind) return false;
  mk.fillStyle = '#fff';
  const eyes = F.info.eyes; const ex = eyes.length ? (eyes[0].x + eyes[eyes.length - 1].x) / 2 : SW / 2; const ey = eyes.length ? eyes[0].y : SH / 2;
  mk.filter = 'blur(3px)';
  if (kind === 'beam') {
    const u = smooth(15.6, 19.2, t); const x0 = lerp(-600, ex + 260, u);
    mk.beginPath(); mk.moveTo(-200, -200); mk.lineTo(x0 + 400, -200); mk.lineTo(x0 - 300, SH + 200); mk.lineTo(-200, SH + 200); mk.closePath(); mk.fill();
  } else if (kind === 'beamChest') {
    mk.beginPath(); mk.moveTo(-200, -200); mk.lineTo(SW + 200, -200); mk.lineTo(SW + 200, SH * .15); mk.lineTo(-200, SH * .75); mk.closePath(); mk.fill();

  for (let i = 0; i < nb; i++) {
    const x = rnd(SW), y = rnd(SH * .2, SH); if (kind === 'beam' || kind === 'face') { if (Math.hypot(x - ex, y - ey) < 260) continue; }

  }

  mk.globalCompositeOperation = 'source-over'; mk.filter = 'none';

}

// ---------- robot ground shadow ----------
function drawRobotShadow(g, cam, J, a) {
  shd.clearRect(0, 0, SW, SH); shd.fillStyle = '#000';

    const Mw = mmul(J[part.joint], part.M);
    const pts = []; const step = Math.max(1, Math.floor(part.mesh.v.length / 24));
    for (let i = 0; i < part.mesh.v.length; i += step) { const w = mp(Mw, part.mesh.v[i]); if (w[1] < -.1) continue; const gp = [w[0] - SUN[0] * w[1] / SUN[1], .02, w[2] - SUN[2] * w[1] / SUN[1]]; const s = cam.project(gp); if (s[2] < .5) continue; pts.push([s[0], s[1]]); }

    const h = hull2(pts); shd.beginPath(); shd.moveTo(h[0][0], h[0][1]); for (const p of h) shd.lineTo(p[0], p[1]); shd.closePath(); shd.fill();

}
function hull2(P) {

}

// ---------- robot frame render (cached on twos) ----------

// ---------- ambient screen-space leaves & motes ----------
function ambientLeaves(g, t, n, big, seed, lit) {
  srand(seed);

    const x0 = rnd(-200, SW + 200), sp = rnd(30, 70) * (big ? 1.6 : 1), ph = rnd(TAU), sz = rnd(4, 9) * (big ? 2.4 : 1), col = LEAF_COLS[rndi(0, 3)], per = (SH + 300) / sp;
    const tt = q2(t) + rnd(per); const k = Math.floor(tt / per); const u = tt - k * per;
    const y = -150 + u * sp; const x = x0 + Math.sin(u * 1.1 + ph + k) * 120 * (big ? 1.5 : 1) + u * 8;
    const flip = Math.sin(u * 2.3 + ph) > 0 ? 1 : -1;

function motes(g, t, n, seed) {

  for (let i = 0; i < n; i++) {

// ---------- shake ----------
function shake(t) {
  let a = 0;
  if (t > 27.6 && t < 31.2) a = 5 * (1 - smooth(30, 31.2, t)) + 2;
  if (t > 31.2 && t < 40) a = 1.5;
  if (t > 47.8 && t < LAUNCH) a = 2 + 4 * smooth(48.8, 49.6, t);
  if (t >= LAUNCH && t < 50.8) a = 11 * Math.exp(-(t - LAUNCH) * 1.4);
  if (!a) return [0, 0];
  const k = Math.floor(t * 12); return [(hash1(k * 1.3) - .5) * 2 * a, (hash1(k * 2.7 + 5) - .5) * 2 * a];
}

// ---------- bird in shot B ----------
function birdState(t, F) {
  const top = F.info.parts.pauldronL; if (!top) return null;
  // landing point: top of left pauldron
  const J = rigAt(0); const P = PARTS.find(p => p.name === 'pauldronL'); const Mw = mmul(J.shL, P.M);
  const lp = SHOTS[1].c.cam.project(mp(Mw, [-.25, .82, .15]));
  const u = t - 8; const tq = q2(u);
  let x, y, pose, s = 78;
  if (tq < 1.7) { const k = tq / 1.7; const e = easeOut(k); x = lerp(SW + 120, lp[0] + 30, e); y = lerp(SH * .12, lp[1] - 60, e) - Math.sin(k * Math.PI) * 60; const f = Math.floor(tq * 12) % 4; pose = { wing: [1, 0, -1, 0][f], body: -.15 + (k > .8 ? -.2 : 0), tail: 0 }; }
  else if (tq < 2.05) { const k = (tq - 1.7) / .35; x = lerp(lp[0] + 30, lp[0], k); y = lerp(lp[1] - 60, lp[1], easeIn(k)); pose = { wing: 1.1, body: -.45, tail: .15, legs: true }; }
  else if (tq < 2.3) { x = lp[0]; y = lp[1] + 3; pose = { wing: .3, body: -.1, tail: .1, legs: true }; }
  else {
    x = lp[0]; y = lp[1]; pose = { wing: 'fold', body: 0, tail: 0, legs: true, head: 0 };
    if (tq > 2.6 && tq < 2.8) pose.tail = .18;
    if (tq > 3.4 && tq < 4.6) pose.head = -.35;
    if (tq >= 4.6 && tq < 4.85) { y -= 10; x -= 6; }
    if (tq >= 4.85) { x -= 10; pose.head = .25; }
    if (tq > 5.6) pose.head = -.1;

  return { x, y: y - s * .42, s, dir: -1, pose };

// ---------- ring of wind ----------
function drawWindRing(g, cam, t) {
  const t0 = LAUNCH - .1; const dt = t - t0; if (dt < 0 || dt > 2.6) return;
  const R = 2 + 60 * (1 - Math.exp(-dt * 1.2)); const a = Math.pow(1 - dt / 2.6, 1.3);
  // dust skirt kicked up behind the front
  srand(99);
  for (let i = 0; i < 40; i++) { const aa = rnd(TAU); const rr = R * rnd(.6, .95); const s = cam.project([Math.cos(aa) * rr, .6, Math.sin(aa) * rr]); if (s[2] < 2) continue; dustPuff(g, s[0], s[1], clamp(1.4 * cam.focal / s[2] * (1 + dt * .6), 4, 160), a * .6, true, i); }
  // the ring itself: soft band + crisp cel streaks
  const ring = (h, k) => { const P = []; for (let i = 0; i <= 96; i++) { const aa = i / 96 * TAU; const s = cam.project([Math.cos(aa) * R * k, h, Math.sin(aa) * R * k]); P.push(s); } return P; };
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  for (const [h, k, al] of [[.8, 1, 1], [2.6, .97, .55]]) {
    const P = ring(h, k);
    for (const [lwM, aM] of [[2.2, .12], [1, .25], [.35, .55]]) {
      g.strokeStyle = `rgba(252,246,228,${a * al * aM})`;
      for (let i = 0; i < P.length - 1; i++) { const p = P[i], q = P[i + 1]; if (p[2] < 1 || q[2] < 1) continue; g.lineWidth = clamp(lwM * 1.2 * cam.focal / p[2], .5, 90); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); }
    }
  }
  // wind streak lines just inside the front
  srand(7);
  g.strokeStyle = `rgba(255,252,240,${a * .7})`;
  for (let i = 0; i < 60; i++) {
    const a0 = rnd(TAU), da = rnd(.03, .08), rr = R * rnd(.8, .99), h = rnd(.3, 4);
    const p = cam.project([Math.cos(a0) * rr, h, Math.sin(a0) * rr]), q = cam.project([Math.cos(a0 + da) * rr, h, Math.sin(a0 + da) * rr]); if (p[2] < 1 || q[2] < 1) continue;
    g.lineWidth = clamp(.12 * cam.focal / p[2], .6, 6); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke();
  }
  g.restore();
}

// ---------- trail of light ----------
function nozzleWorld(t) { const J = rigAt(t); return mp(J.chest, [0, -.6, -1.55]); }
function drawTrail(g, cam, t) {
  if (t < LAUNCH) return;
  const pts = [];
  const tStart = LAUNCH; const N = 90;
  for (let i = 0; i <= N; i++) { const tt = lerp(tStart, t, i / N); const p = nozzleWorld(tt); const age = t - tt; p[1] -= age * .4; p[0] += age * .5; const s = cam.project(p); if (s[2] < .5) continue; pts.push({ x: s[0], y: s[1], age, z: s[2] }); }
  if (pts.length < 3) return;
  // mist body
  g.save();
  for (let i = 0; i < pts.length; i += 2) {
    const p = pts[i]; const r = clamp((1.5 + p.age * 2.2) * cam.focal / p.z, 10, 320); const a = clamp(.45 - p.age * .028) * .7;
    if (a <= 0) continue; const rg = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); rg.addColorStop(0, `rgba(255,245,225,${a})`); rg.addColorStop(1, 'rgba(255,240,215,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(p.x, p.y, r, 0, TAU); g.fill();
  }
  // bright core ribbon
  g.globalCompositeOperation = 'lighter';
  const core = pts.filter(p => p.age < 7.5).map(p => [p.x, p.y]);
  if (core.length > 2) {
    const sc = cam.focal / pts[pts.length - 1].z;
    g.filter = 'blur(6px)'; g.fillStyle = 'rgba(255,200,120,.6)'; inkStroke(g, core, clamp(2.6 * sc, 18, 90), { tmin: .1, taperLen: 60 }); g.filter = 'none';
    g.fillStyle = 'rgba(255,226,170,.7)'; inkStroke(g, core, clamp(1.1 * sc, 7, 40), { tmin: .1, taperLen: 60 });
    g.fillStyle = 'rgba(255,252,240,1)'; inkStroke(g, core, clamp(.4 * sc, 3, 16), { tmin: .1, taperLen: 60 });
  }
  g.restore();
}

// ---------- main frame ----------
const OUT = document.getElementById('film'); const out = OUT.getContext('2d');
function renderFrame(t) {

  stg.setTransform(1, 0, 0, 1, 0, 0); stg.globalAlpha = 1; stg.globalCompositeOperation = 'source-over';
  stg.drawImage(V.bg, 0, 0);

  const co = R.F.info.core; if (co && co.front && cg > 0 && robotOn) { glow(stg, co.x, co.y, co.r * 4, '#9ff5ee', cg * .45); glow(stg, co.x, co.y, co.r * 1.3, '#f0fffb', cg * .7); }
  if (ng > 0 && robotOn) for (const n of R.F.info.nozzles) {
    glow(stg, n.x, n.y, n.r * 5 * (1 + ng), '#ffd890', ng * .6);
    if (t > LAUNCH - .35) drawFlame(stg, n.x, n.y, n.x2, n.y2, n.r * .55, clamp((t - LAUNCH + .35) * 2.5) * (1 + .6 * clamp(t - LAUNCH)), Math.floor(t * 24));
  }

  stg.globalAlpha = .12; stg.drawImage(V.mistB, -(t * 11) % SW, SH * .1); stg.globalAlpha = 1;
  if (s.name === 'I') { drawWindRing(stg, cam, t); if (t > LAUNCH - .1) ambientLeaves(stg, t, 50, true, 21, true); }
  if (s.name === 'F' || s.name === 'G') ambientLeaves(stg, t, s.name === 'F' ? 30 : 18, false, 8, true);
  if (s.camKey === 'sky') ambientLeaves(stg, t, s.end ? 34 : 22, true, 44, true);
  if (s.name === 'A' || s.name === 'B') ambientLeaves(stg, t, 5, false, 2, false);

    srand(Math.floor(t * 24)); const k = 1 - (t - LAUNCH) / 1.2; stg.strokeStyle = `rgba(255,250,235,${.5 * k})`;
    const c = cam.project([0, 10, 0]);

  }

}
function grade(t, s) {

  out.restore();

  vg.addColorStop(0, 'rgba(20,18,30,0)'); vg.addColorStop(1, 'rgba(20,18,30,.38)'); out.fillStyle = vg; out.fillRect(0, 0, OW, OH);

  if (fb > 0) { out.fillStyle = `rgba(6,6,10,${fb})`; out.fillRect(0, 0, OW, OH); }

  if (!_paperTex) _paperTex = paperTexture(512, 512);
  out.save(); out.globalCompositeOperation = 'overlay'; out.globalAlpha = .06; const k = Math.floor(t * 12) % 4;
  out.translate(k * 97 % 512, k * 53 % 512); out.fillStyle = out.createPattern(_paperTex, 'repeat'); out.fillRect(-512, -512, OW + 1024, OH + 1024); out.restore();
}

// ---- main.js ----
// ================= playback & UI =================
(async function boot() {
  const q = new URLSearchParams(location.search);
  const bar = document.getElementById('lbar'), load = document.getElementById('loading');
  await prepare(p => { if (bar) bar.style.width = (p * 100).toFixed(0) + '%'; });
  if (q.has('layer')) window.DEBUG_LAYER = q.get('layer');
  if (q.has('t')) { // single-frame render (used for inspection)
    const times = q.get('t').split(',').map(Number);
    if (times.length === 1) { renderFrame(times[0]); load.style.display = 'none'; document.title = 'done'; return; }
    // contact sheet
    const sheet = document.createElement('canvas'); const cols = 3; const rows = Math.ceil(times.length / cols);
    sheet.width = OW / 2 * cols; sheet.height = OH / 2 * rows; const sg = sheet.getContext('2d');
    times.forEach((tt, i) => { renderFrame(tt); sg.drawImage(OUT, (i % cols) * OW / 2, Math.floor(i / cols) * OH / 2, OW / 2, OH / 2); sg.fillStyle = '#fff'; sg.font = '16px sans-serif'; sg.fillText(tt.toFixed(2), (i % cols) * OW / 2 + 8, Math.floor(i / cols) * OH / 2 + 20); });
    OUT.width = sheet.width; OUT.height = sheet.height; OUT.getContext('2d').drawImage(sheet, 0, 0);
    load.style.display = 'none'; document.title = 'done'; return;
  }
  load.style.display = 'none';
  const ui = document.getElementById('ui'), prog = document.getElementById('prog'), playBtn = document.getElementById('play');
  let playing = false, t = 0, last = 0;
  renderFrame(0.0001); renderFrame(2.2);
  document.getElementById('start').style.display = 'flex';
  const tick = (now) => {
    if (playing) { t += (now - last) / 1000; if (t >= DUR) { t = DUR; playing = false; playBtn.textContent = '↻'; } }
    last = now; renderFrame(t); prog.style.width = (t / DUR * 100) + '%';
    requestAnimationFrame(tick);
  };
  const toggle = () => { if (t >= DUR) t = 0; playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; last = performance.now(); };
  document.getElementById('start').onclick = () => { document.getElementById('start').style.display = 'none'; ui.style.display = 'flex'; toggle(); requestAnimationFrame(n => { last = n; tick(n); }); };
  playBtn.onclick = toggle;
  document.getElementById('track').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); t = clamp((e.clientX - r.left) / r.width, 0, 1) * DUR; };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } if (e.code === 'ArrowRight') t = Math.min(DUR, t + 2); if (e.code === 'ArrowLeft') t = Math.max(0, t - 2); });
})();
